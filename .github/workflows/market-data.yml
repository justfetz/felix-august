name: Refresh market data

on:
  schedule:
    # Weekdays ~1.5h after the U.S. close (20:00 ET standard / 21:30 UTC-ish).
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Treasury yields and ticker quotes
        id: fetch
        run: |
          set +e
          python3 tools/fetch_market_data.py 2> fetch.err
          CODE=$?
          {
            echo "### Market data fetch"
            echo
            echo "exit code: $CODE"
            echo
            echo '```'
            tail -c 4000 fetch.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat fetch.err >&2
          echo "$CODE" > fetch.code
          exit $CODE
      - name: Record fetch diagnostics on the branch (diagnostic branch only)
        if: always() && github.ref_name == 'fix/market-data'
        run: |
          mkdir -p .diag
          { echo "exit code: $(cat fetch.code)"; echo; cat fetch.err; } > .diag/fetch.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diag/fetch.txt
          git commit -m "diag: market-data fetch stderr" || true
          git push || true

      - name: Commit refreshed data
        run: |
          if git diff --quiet data/market.json; then
            echo "market.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Refresh market data"
          git push
